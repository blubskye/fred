SecurityLevels.passwordWrong=パスワードが間違っています。クライアントキャッシュへのアクセスとブラウジング性能向上のため、正しいパスワードを入力してください。
SecurityLevels.enterPassword=ダウンロード／アップロードへのアクセスを有効にし、最近訪問したfreesiteキャッシュを使って性能を向上させるため、マスターパスワードを入力してください。
SecurityLevels.setPasswordLabel=パスワードを設定
SecurityLevels.confirmPasswordLabel=パスワードを確認
SecurityLevels.passwordLabel=パスワード
SecurityLevels.setPassword=キャッシュされたコンテンツを保護するマスターパスワードを設定してください。文字・数字・記号を組み合わせた長いパスワードがより強力です。
SecurityLevels.passwordNotZeroLength=パスワードは1文字以上必要です（空欄は不可）。
SecurityLevels.passwordsDoNotMatch=入力したパスワードが一致しません。
SecurityLevels.passwordTooLong=パスワードが長すぎます（最大1024文字）。
SecurityLevels.passwordForDecryptTitle=以前のパスワードを入力
SecurityLevels.passwordForDecrypt=クライアントキャッシュなどのロックを解除するには、以前のパスワードが必要です。
SecurityLevels.cantWriteNewMasterKeysFileTitle=新しいmaster.keysファイルに書き込めません！
SecurityLevels.cantWriteNewMasterKeysFile=ディスク容量不足かハードディスクの問題が発生した可能性があります。詳細は以下のエラーメッセージを確認してください：
SecurityLevels.oldPasswordLabel=以前のパスワード：
SecurityLevels.newPasswordLabel=新しいパスワード：
SecurityLevels.confirmNewPasswordLabel=新しいパスワードの確認：
SecurityLevels.setPasswordTitle=新しいマスターパスワードを設定
SecurityLevels.changePasswordButton=パスワードを変更
SecurityLevels.changePasswordTitle=マスターパスワードを変更
SecurityLevels.backToSecurityLevels=パスワードの設定・変更をキャンセルしてセキュリティレベルページに戻る
SecurityLevels.passwordFileCorruptedTitle=マスターパスワードファイルが破損しています
SecurityLevels.passwordFileCorrupted=マスターパスワードファイル ${file} が破損しています。ファイルを削除してクライアントキャッシュとダウンロード／アップロードキューを失うか、バックアップから復元してください。
SecurityLevels.wrongOldPassword=以前のパスワードが違います。パスワードを忘れた場合はmaster.keysファイルを削除して新しいパスワードを設定できますが、以前のデータ（最近訪問サイトキャッシュやダウンロードキューなど）はすべて失われます。
SecurityLevels.cantDeletePasswordFileTitle=マスターパスワードファイルを削除できません！
SecurityLevels.cantDeletePasswordFile=ハイファネットがマスターパスワードファイル ${filename} を削除できませんでした。コンピューターが押収された場合に最近訪問サイトキャッシュやダウンロード／アップロードが復号化されるのを防ぐため、手動で安全に削除してください。
SecurityLevels.cantDeletePasswordFileButton=再試行
SecurityLevels.warningMaximumWillDeleteQueue=警告：このセキュリティレベルを選択すると、次回再起動時にダウンロード／アップロードキューが削除されます！
SecurityLevelsToadlet.fullTitle=セキュリティレベル
SecurityLevels.statusBarPrefix=セキュリティレベル：
StringArrOption.parseError=文字列配列として値を解析できません：${error}
ShortOption.unrecognisedShort=指定された値は16ビット整数として解析できません：${val}
SimpleHelpToadlet.CHK=CHK = Content Hash Key - ファイルの内容から計算される静的なキーです。
SimpleHelpToadlet.SSK=SSK = Signed Subspace Key -
