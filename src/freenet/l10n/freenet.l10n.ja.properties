Announcer.announceAlertIntro=ハイファネットがネットワークに接続しています。この処理には数分かかることがあります。性能は今後数時間かけて徐々に向上します。ハイファネットを数分以上停止するたびに発生しますので、可能な限り24時間稼働させておくことをおすすめします。
Announcer.announceAlertTitle=ノードをアナウンス中
Announcer.announceDetails=最近 ${recentSentAnnouncements} 件のアナウンスを送信しました。そのうち ${runningAnnouncements} 件がまだ実行中です。${addedNodes} 個のノードを追加し、${refusedNodes} 個のノードから拒否されました。現在 ${connectedSeednodes} 個のシードノードに接続しており、さらに ${disconnectedSeednodes} 個への接続を試みています。
Announcer.announceAlertNoSeednodes=seednodes.fref ファイルが見つかりません。そのため、ハイファネットノードは自動的にオープンネットに参加できません。ノードを手動で追加するか、https://raw.githubusercontent.com/hyphanet/java_installer/refs/heads/next/offline/seednodes.fref からシードノードファイルをダウンロードしてください。
Announcer.announceLoading=ハイファネットは現在、ネットワーク全体へのアナウンスを行うためにシードノードファイルを読み込んでいます。完了まで数分かかる場合があります。
Announcer.announceDisabledTooOldTitle=アナウンスを無効化（バージョンが古すぎます）
Announcer.announceDisabledTooOld=このノードは現在のハイファネットネットワークに接続するにはバージョンが古すぎます。ピアから新しいバージョンをダウンロードした後、更新のために自動で再起動します。しばらくお待ちください。更新が完了するとこのメッセージは消えます。意味のないアナウンスを停止しました。
Announcer.announceDisabledTooOldUpdateDisabled=ハイファネットの自動更新を有効にするには、${config}設定ページ${/config}で自動更新をオンにしてください。
Announcer.announceDisabledTooOldShort=ハイファネットノードがネットワークに接続を試みましたが、バージョンが古すぎてデータをルーティングできません。更新してください。
Announcer.announceAlertShort=ハイファネットがネットワークに接続を試みています。しばらくの間、動作が遅くなる可能性があります。
Announcer.coolingOff=次の ${time} 秒間、ハイファネットノードは先ほどアナウンスしたノードからの接続を待機しています。十分なノードが集まらない場合は別のノードを試します。
Announcer.dontKnowAddress=まだ自分のIPアドレスを特定できていません。IPが判明するまでアナウンスは行えません。
