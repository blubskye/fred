SecurityLevels.physicalThreatLevel=コンピューターが盗まれたり押収された場合、どの程度心配ですか？
SecurityLevels.physicalThreatLevelFDE=ハードディスク全体を${link}フルディスク暗号化${/link}ソフトで暗号化することを強くおすすめします。特にSoneやFMSなどのサードパーティアプリを使う場合に最適ですが、設定に時間がかかるかもしれません。あるいは、ダウンロード・アップロード・最近訪問したfreesiteキャッシュにパスワードを設定できます。
SecurityLevels.physicalThreatLevelFDELink=https://en.wikipedia.org/wiki/Comparison_of_disk_encryption_software
SecurityLevels.physicalThreatLevelSwapfile=可能であればスワップ領域も暗号化してください（${operatingSystem}がメモリ不足時に使用する一時ファイル）。フルディスク暗号化より簡単に設定できる場合があります。
SecurityLevels.physicalThreatLevelSwapfileWindows=一部のWindowsではコマンド「fsutil behavior set encryptpagingfile 1」でスワップファイルを暗号化できます。
SecurityLevels.physicalThreatLevel.name.LOW=なし
SecurityLevels.physicalThreatLevel.choice.LOW=何も暗号化しません（すでにフルディスク暗号化を使っている場合のみ選択）
SecurityLevels.physicalThreatLevel.desc.LOW=ハイファネットが少し速くなり、既存のフルディスク暗号化に依存します。
SecurityLevels.physicalThreatLevel.name.NORMAL=低
SecurityLevels.physicalThreatLevel.choice.NORMAL=すぐに消去可能な強力な鍵でダウンロード・アップロード・最近訪問キャッシュを暗号化します。
SecurityLevels.physicalThreatLevel.desc.NORMAL=パニックボタンを使うかmaster.keysファイルを安全に削除すればデータを素早く消去できます。大きなファイルは「ダウンロード」ではなく「取得」をおすすめします。取得したファイルは暗号化され、ダウンロードページからのみ閲覧できます。
SecurityLevels.physicalThreatLevel.name.HIGH=高
SecurityLevels.physicalThreatLevel.choice.HIGH=パスワードでダウンロード・アップロード・最近訪問キャッシュを保護します。
SecurityLevels.physicalThreatLevel.desc.HIGH=ダウンロードキューや最近訪問サイトキャッシュにアクセスするにはパスワードが必要です。パニックボタンも使用できます。
SecurityLevels.physicalThreatLevel.name.MAXIMUM=最高
SecurityLevels.physicalThreatLevel.choice.MAXIMUM=一時的な鍵を使い、再起動時にダウンロード・アップロード・閲覧キャッシュがすべて消去されます。
SecurityLevels.physicalThreatLevel.desc.MAXIMUM=暗号化鍵をRAMのみに保持し、ディスクに保存しません。再起動までしかデータが残らず、ディスクへの書き込みも拒否します。Freenetからコンテンツを誤って保存しないよう注意してください。特にFMSやSoneなどのサードパーティプラグインを使う場合は、フルディスク暗号化ソフトの導入を検討してください。
SecurityLevels.physicalThreatLevelEnd=通常のセキュリティ対策（最新版の使用、アンチウイルス実行、信頼できないファイルを開かないなど）を忘れずに行ってください。ハイファネットが起動している状態でコンピューターが押収された場合、どんな暗号化も役に立ちません。
