StatisticsToadlet.avgLocation=平均位置
StatisticsToadlet.avgSuccessLoc=平均成功位置
StatisticsToadlet.avgTime=平均時間
StatisticsToadlet.bandwidthTitle=帯域幅
StatisticsToadlet.CACHE=キャッシュ
StatisticsToadlet.capacity=容量
StatisticsToadlet.CHK=CHK
StatisticsToadlet.chkCache=キャッシュ（CHK）
