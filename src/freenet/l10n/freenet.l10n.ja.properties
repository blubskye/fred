DarknetAddRefToadlet.title=友達と接続
DarknetAddRefToadlet.explainBoxTitle=ハイファネットを実行している友達と接続するべき理由
DarknetAddRefToadlet.explainBox1=実際に知っているハイファネットユーザー（友達）と接続すると、セキュリティが大幅に向上します。オンライン上の知り合いでも構いませんが、見知らぬ人を追加するのは避けてください。見知らぬ人を友達として追加してもセキュリティはほとんど向上せず、多くの人が同じことをするとネットワーク全体に悪影響を及ぼします。常にオンラインの友達を最低5人以上追加できれば、ネットワークセキュリティレベルを「高」に上げ、友達だけと接続する「ダークネットモード」にできます。これにより、攻撃者があなたがハイファネットを使っていることすら探知しにくくなり、匿名性攻撃が格段に困難になります。ハイファネットはインターネット経由で友達と直接暗号化接続を張るため、すでに容易に連絡を取れる人（家族、同僚、実生活の友人、信頼できるオンライン友人）だけを追加してください。
DarknetAddRefToadlet.explainInstallerWindows=最新のWindowsインストーラーは ${filename} または ${get-windows}こちら${/get-windows} から入手できます。
DarknetAddRefToadlet.explainInstallerWindowsNotYet=まだWindowsインストーラーをダウンロードできていませんが、ハイファネット経由で ${link}こちら${/link} から入手できます。
DarknetAddRefToadlet.explainInstallerNonWindows=最新の非Windowsインストーラーは ${filename} または ${get-nonwindows}こちら${/get-nonwindows} から入手できます。これはJavaで実行するjarファイルです。ダブルクリックで起動できるはずですが、起動しない場合はコマンドラインで「java -jar ${shortfilename}」と入力してみてください。
DarknetAddRefToadlet.explainInstallerNonWindowsNotYet=まだ非Windowsインストーラーをダウンロードできていませんが、ハイファネット経由で ${link}こちら${/link} から入手できます。これはJavaで実行するjarファイルです。
DarknetAddRefToadlet.explainBox2=友達と接続するには、お互いのnoderef（ノード参照）を交換する必要があります。noderefは相手のハイファネットノードがあなたのノードに接続するために必要な小さなファイルです。双方が相手のnoderefを追加しないと接続できません。あなたのnoderefは以下に表示されています。
