SecurityLevels.title=セキュリティレベル
SecurityLevels.tooltip=ハイファネットノードのセキュリティレベルを設定します
SecurityLevels.networkThreatLevelShort=インターネット経由の未知の攻撃者からの保護
SecurityLevels.networkThreatLevel=ハイファネットでの行動を追跡しようとする人物や組織から、どの程度の保護が必要ですか？
SecurityLevels.networkThreatLevel.name.MAXIMUM=最高
SecurityLevels.networkThreatLevel.name.HIGH=高
SecurityLevels.networkThreatLevel.name.NORMAL=通常
SecurityLevels.networkThreatLevel.name.LOW=低
SecurityLevels.networkThreatLevel.choice.MAXIMUM=逮捕・起訴・それ以上のリスクを伴う情報にアクセスする可能性があります。ハイファネットは実験的で一部の攻撃に対して完全に安全とは言えないことを理解し、リスクを承知で使用します。
SecurityLevels.networkThreatLevel.desc.MAXIMUM=HIGH設定より${bold}大幅に${/bold}遅くなり、友達とのみ接続します。信頼できる人だけと接続していれば実名は比較的安全です。詳細はウィザードの${link}「ハイファネットを誰と接続すべきか」ページ${/link}の下部を参照してください。
SecurityLevels.networkThreatLevel.choice.HIGH=他人に通信を監視されたくない、またはISP・政府によるハイファネット遮断を懸念しています。
SecurityLevels.networkThreatLevel.desc.HIGH=友達だけと接続するとセキュリティが大幅に向上しますが、最低5〜10人の友達を追加しないと遅くなります。
SecurityLevels.networkThreatLevel.choice.NORMAL=比較的自由な国に住んでいますが、通信を監視されにくくしたいです。
SecurityLevels.networkThreatLevel.desc.NORMAL=ハイファネットは匿名性をある程度守りますが、性能が少し低下します。ハイファネットを使っている友達を追加し、可能ならHIGHに上げてください。
SecurityLevels.networkThreatLevel.choice.LOW=監視を気にせず最大の性能を求めます。
SecurityLevels.networkThreatLevel.desc.LOW=他人に自分の身元が簡単に特定される可能性があります！
SecurityLevels.networkThreatLevel.opennetIntro=すでにハイファネットを使っている人を個人的に知っていますか？3人以上知っている場合はダークネットモードを有効にできます。友達だけと接続され、セキュリティが大幅に向上します。知っている人がいない場合や最大性能を求める場合はオープンネットモードにしてください。見知らぬ人のハイファネットノードと自動接続されます。
SecurityLevels.networkThreatLevel.opennetFriendsWarning=ハイファネット外で知らない人を友達として追加してもセキュリティは向上せず、性能が低下します！
SecurityLevels.networkThreatLevel.opennetLabel=オープンネットモード（見知らぬ人＋友達と接続）
SecurityLevels.networkThreatLevel.opennetExplain=ハイファネットを使っている人を知りません：他のハイファネットノードと自動接続します。
SecurityLevels.networkThreatLevel.darknetLabel=ダークネットモード（友達だけと接続）
SecurityLevels.networkThreatLevel.darknetExplain=すでにハイファネットを使っている人を少なくとも3人（性能を求めるなら10人以上）知っています：友達だけと接続します。
SecurityLevels.noFriendsWarning=まだ友達を追加していません。ネットワークセキュリティレベルを高または最高に設定すると、接続済みの友達が少なくとも1人いないとハイファネットに接続できなくなります！意味のあるセキュリティ効果を得るには、実際に知っていてある程度信頼できる人で、性能を保つには5〜10人が常に接続している必要があります。本当に設定しますか？
SecurityLevels.noFriendsCheckbox=問題ありません。高セキュリティレベルを有効にし、すぐに友達を追加します。
SecurityLevels.noConnectedFriendsWarning=${added}人の友達を追加しましたが、接続されている友達がいません。高または最高のセキュリティレベルにすると、友達がオンラインのときしか接続できません。友達を追加するか、友達がオンラインのときだけ使うか、高セキュリティにしないことをおすすめします。意味のあるセキュリティのためには実際に知っていて信頼できる人で、性能のためには5〜10人が常に接続している必要があります。本当に設定しますか？
SecurityLevels.noConnectedFriendsCheckbox=問題ありません。友達を追加するか、友達がオンラインのときだけハイファネットが使えることを承知します。
SecurityLevels.fewConnectedFriendsWarning=現在接続されている友達は${connected}人だけで、合計${added}人を追加しています。高または最高のセキュリティレベルにすると友達だけと接続されるため性能が大幅に低下し、全員がオフラインの場合は接続自体ができなくなります。本当に設定しますか？
SecurityLevels.fewConnectedFriendsCheckbox=問題ありません。友達を追加するか、性能低下と友達オフライン時の接続不可を承知します。
SecurityLevels.networkThreatLevelLowWarning=ネットワークセキュリティレベルを低に下げようとしています。これにより、見知らぬ人がインターネット経由で匿名性を簡単に攻撃できるようになります。本当に下げますか？
SecurityLevels.networkThreatLevelLowCheckbox=問題ありません。速度を優先し、ハイファネットで何をしているか他人に知られても構いません。
SecurityLevels.networkThreatLevelConfirmTitle=警告：ネットワークセキュリティレベルを${mode}に設定します
SecurityLevels.maximumNetworkThreatLevelWarning=${bold}警告：${/bold}最大ネットワークセキュリティレベルを設定しようとしています！ハイファネットが${bold}大幅に${/bold}遅くなります。本当に必要な場合以外は設定しないでください！
SecurityLevels.maxSecurityYouNeedFriends=${bold}すでにハイファネットを実行している人を少なくとも1人${/bold}（できれば3人、性能を求めるなら5〜10人）知っている必要があります。友達ページで追加してください。実際に知っていてある程度信頼できる人でなければなりません。
SecurityLevels.maximumNetworkThreatLevelCheckbox=はい、最高のセキュリティを有効にします。ハイファネットが実験的で追跡される可能性があり、性能が大幅に低下することを理解しています。
