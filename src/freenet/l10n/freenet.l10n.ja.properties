FirstTimeWizardToadlet.browserWarning=通常のウェブ閲覧とハイファネットを同じブラウザで併用しないでください（シークレット／プライベートモードを除く）。特にブラウザ履歴窃取攻撃により、最近訪れたfreesiteを悪意あるサイトに知られる危険があります。ハイファネット専用のブラウザを使用してください。Windowsではシステムトレイのウサギアイコンから「Browse Freenet」を選ぶと、Chromeのシークレットモードが自動で開きます。
FirstTimeWizardToadlet.browserWarningMaybeSafe=比較的新しいブラウザを使用しているため比較的安全ですが、ハイファネットの訪問履歴がブラウザに残ります。プライベート／シークレットモードを使えば履歴が残りません。
FirstTimeWizardToadlet.browserWarningIncognito=シークレット／プライベートモードで使用しているようです（タイトルバーで確認）。比較的安全ですが、通常のウェブとハイファネットを同じブラウザで併用しないでください。
FirstTimeWizardToadlet.browserWarningIncognitoMaybeSafe=最近のブラウザのシークレット／プライベートモードを使用しているようです。比較的安全です。Firefox 4より古いバージョンでは、通常のウェブとハイファネットを同じブラウザで併用しないでください。
FirstTimeWizardToadlet.browserWarningFirefoxMightHaveClobberedTabs=ハイファネットがFirefoxをプライベートモードで起動しようとしました。これによりハイファネットの訪問履歴が残りません。一部のバージョンでは既存のウィンドウやタブが閉じられることがあります。ツールメニューから「プライベートブラウジングを停止」で元に戻せます。プライベートモードの場合、タイトルバーやタブに表示されます。そうでなければ手動でプライベートモードで開き、${url}にアクセスするか、ハイファネット専用のブラウザ／プロファイルを使用してください。
FirstTimeWizardToadlet.browserWarningOldFirefox=Firefox 3以前の古いバージョンを使用しています。Firefox 4以降にはCSS履歴漏洩防止機能が追加されています。可能な限りアップグレードしてください。
FirstTimeWizardToadlet.browserWarningOldFirefoxNewerHasPrivacyMode=新しいFirefoxはプライベートモードもサポートしています。
FirstTimeWizardToadlet.browserWarningSuggestion=Microsoft Internet Explorerを除くほとんどのブラウザ（Firefox、Opera、Safari、Chrome、Lynxなど）がハイファネットで動作します。インストール後、現在のURLをコピーして新しいブラウザで開いてください。
FirstTimeWizardToadlet.browserImeWarning=サードパーティのIME（アジア言語入力メソッド）を使用している場合、ハイファネットでは無効にしてOS標準のIMEを使用してください。IMEが入力内容を収集するという報告があります。
