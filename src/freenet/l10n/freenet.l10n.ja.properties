SecurityLevels.userAlertNetworkThreatLevel=インターネット経由の未知の攻撃者からの保護：${level}
SecurityLevels.userAlertPhysicalThreatLevel=コンピューター押収・盗難時の保護：${level}
SecurityLevels.userAlertExtro=これらの設定は${link}設定ページ${/link}でいつでも変更できます。
