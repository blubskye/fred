SimpleHelpToadlet.connectivityText=テスト中です。
SimpleHelpToadlet.connectivityTitle=接続性
SimpleHelpToadlet.definitionsTitle=用語解説
SimpleHelpToadlet.descriptionText=このページではハイファネットを始めるための基本情報を提供しています。より詳しい情報は公式サイト http://hyphanet.org、公式wiki、またはハイファネット内のfreesiteで確認できます。
SimpleHelpToadlet.descriptionTitle=説明
SimpleToadletServer.advancedMode=高度モードを有効にしますか？
SimpleToadletServer.advancedModeLong=ウェブインターフェースで高度なオプションと情報をデフォルトで表示します。ほとんどの場合はオフ（false）にしておくことをおすすめします。
SimpleToadletServer.allowedFullAccess=ハイファネットウェブインターフェースへの完全アクセスを許可するホスト（警告をお読みください）
SimpleToadletServer.allowedFullAccessLong=設定変更や再起動など、ハイファネットノードへの完全アクセスを許可するホストです。警告：完全アクセス権を与える相手は慎重に選んでください！
SimpleToadletServer.allowedHosts=ウェブインターフェースへの接続を許可するホスト名またはIPアドレス
SimpleToadletServer.allowedHostsLong=単一IPまたは192.168.0.0/24のようなCIDR表記のリストをカンマ区切りで指定できます。他の設定次第でハードディスクへのアクセスやブックマークの閲覧が可能になります。
SimpleToadletServer.bindTo=バインドするIPアドレス
SimpleToadletServer.bindToLong=バインドするIPアドレス
SimpleToadletServer.cannotChangePortOnTheFly=ウェブインターフェースのポート番号は実行中に変更できません
SimpleToadletServer.couldNotChangeBindTo=ウェブインターフェースのバインドアドレスを変更できませんでした：一部のIPアドレスにバインドできませんでした（${failedInterfaces}）。IPアドレスの入力ミスかネットワーク接続の問題の可能性があります。
SimpleToadletServer.cssName=ウェブインターフェースのテーマ
SimpleToadletServer.cssNameLong=ハイファネットウェブインターフェースに使用するテーマを選択してください
SimpleToadletServer.cssOverride=CSSをカスタムファイルで上書き（警告！）
SimpleToadletServer.cssOverrideCantRead=指定されたCSS上書きファイルを読み込めません：${filename}
SimpleToadletServer.cssOverrideLong=ハイファネットのCSSをカスタムファイルで上書きできます。警告：CSSは危険な場合があり、フィルタリングされません！自己責任で使用してください。/static/override/（ファイルがあるフォルダ内）からCSSファイルにアクセスできますので、画像や他のCSSを@includeできます。良いテーマを作ったらdevl@hyphanet.orgまでご連絡ください。
SimpleToadletServer.cssOverrideNotInUploads=その設定は許可されません：「${filename}」はアップロードが許可されたディレクトリにありません！
SimpleToadletServer.cssOverrideCantUseRootDir=上書きファイルをルートフォルダ（${filename}）に置くことはできません。フォルダ内に移動してください（セキュリティのため）。
SimpleToadletServer.disableProgressPage=ページ読み込み時の進行状況ページを無効にしますか？
SimpleToadletServer.disableProgressPageLong=ページ読み込み時に進行状況ページを表示しません。注：進行状況ページは取得状況のフィードバックを与え、ブラウザの接続制限をより有効に活用できます。
SimpleToadletServer.doRobots=robots.txtでロボットを排除しますか？
SimpleToadletServer.doRobotsLong=/robots.txtを提供してGoogleやspider、wgetなどのアクセスを拒否するかどうか
SimpleToadletServer.enableActivelinks=アクティブリンクを有効にしますか？
SimpleToadletServer.enableActivelinksLong=Browse Freenetページにブックマークされた各ページのアイコンを表示するかどうか。アイコンを表示しない方がページの読み込みが速くなります。
SimpleToadletServer.enableCachingForChkAndSskKeys=CHKおよびSSKキーに対するブラウザキャッシュを許可しますか（警告をお読みください）
SimpleToadletServer.enableCachingForChkAndSskKeysLong=ブラウザがCHKとSSKキーをキャッシュできるようにします。警告：ブラウザキャッシュにすべてのキーの痕跡が残るため、コンピューター押収の可能性がある場合は有効にしないでください！
SimpleToadletServer.enableJS=ウェブインターフェースでのJavaScript使用を許可しますか？
SimpleToadletServer.enableJSLong=ウェブインターフェースがJavaScript「helpers」を使用するかどうか。freesiteは、この設定に関係なくJavaScriptを使用しない場合があります。
SimpleToadletServer.enableWP=ウェブインターフェースでのウェブプッシュ（実験的）使用を許可しますか？
SimpleToadletServer.enableWPLong=ウェブインターフェースがJavaScriptウェブプッシュを使ってページを再読み込みせずにデータを更新するかどうか。JavaScriptがオンである必要があります。実験的な機能ですので自己責任で使用してください。
SimpleToadletServer.enabled=ウェブインターフェース（FProxy）を有効にしますか？
SimpleToadletServer.enabledLong=ウェブインターフェースと関連するHTTPサービスを有効にするかどうか。ブラウザでハイファネットのユーザーインターフェースにアクセスできます。
SimpleToadletServer.enableExtendedMethodHandling=拡張HTTPメソッド処理を有効にしますか？
SimpleToadletServer.enableExtendedMethodHandlingLong=GETとPOST以外のHTTPメソッドを処理するかどうか。WebDAVなどの拡張に必要です。
SimpleToadletServer.enableInlinePrefetch=インライン画像の先読みを有効にしますか？
SimpleToadletServer.enableInlinePrefetchLong=ブラウザがハイファネットと少ない接続数しか使わない場合に役立つ可能性がありますが、逆効果の場合もあります。
SimpleToadletServer.enablePersistentConnections=持続的なHTTP接続を有効にしますか？（詳細説明をお読みください）
SimpleToadletServer.enablePersistentConnectionsLong=ブラウザが持続接続でも多数の接続を使用するよう設定されている場合にのみ有効にしてください。
SimpleToadletServer.fetchKeyBoxAboveBookmarks=「freesite訪問またはファイルダウンロード」欄を上部に配置しますか？
SimpleToadletServer.fetchKeyBoxAboveBookmarksLong=trueにするとホームページ上部に「freesite訪問またはファイルダウンロード」欄が表示されます。
SimpleToadletServer.hasCompletedWizard=初回設定ウィザードを完了しましたか？
SimpleToadletServer.hasCompletedWizardLong=初回設定ウィザードを完了したかどうか。未完了の場合、ウェブインターフェースはすべてのリクエストをウィザードにリダイレクトします。
SimpleToadletServer.illegalCSSName=CSS名にスラッシュやコロンは使用できません！
SimpleToadletServer.maxFproxyConnections=最大fproxy接続数
SimpleToadletServer.maxFproxyConnectionsLong=同時に処理する最大fproxy接続数。各接続はスレッドを使用します。
SimpleToadletServer.metaRefreshSamePageInterval=freesiteが定期的に自身を更新することを許可：最小間隔（秒）または-1で無効
SimpleToadletServer.metaRefreshSamePageIntervalLong=HTML meta refreshでfreesiteが定期的に自身を更新することを許可：最小間隔（秒）または-1で無効
SimpleToadletServer.metaRefreshRedirectInterval=freesiteが遅延後に他のfreesiteへリダイレクトすることを許可：最小間隔（秒）または-1で無効
SimpleToadletServer.metaRefreshRedirectIntervalLong=HTML meta refreshでfreesiteが遅延後に他のfreesiteへリダイレクトすることを許可：最小間隔（秒）または-1で無効
SimpleToadletServer.embedM3uPlayerInFreesites=freesiteにm3uプレイヤーを埋め込みますか？
SimpleToadletServer.embedM3uPlayerInFreesitesLong=ハイファネットチームが検証したJavaScriptベースのプレイヤーを、video/audioタグのm3uプレイリストをインタラクティブなストリーミングプレイヤーに変換して埋め込むかどうか。
SimpleToadletServer.panicButton=パニックボタンを表示しますか？
SimpleToadletServer.panicButtonLong=キューページに「パニックボタン」を表示します。すべてのダウンロード／アップロードを削除し、最近訪問したfreesiteキャッシュを消去し、master.keysファイルを削除します。
SimpleToadletServer.noConfirmPanic=パニックボタンに確認ダイアログを表示しない
SimpleToadletServer.noConfirmPanicLong=trueにすると確認なしで即座に実行します。
SimpleToadletServer.passthroughMaxSize=進行状況を表示できないウェブインターフェースの透過パススルー最大サイズ（例：画像）
SimpleToadletServer.passthroughMaxSizeLong=画像やスタイルシートなどの最大サイズ。このサイズを超えると失敗し、可能であればエラーを表示します。巨大な画像でブラウザが永遠に待つことを防ぎます。
SimpleToadletServer.passthroughMaxSizeProgress=進行状況バーを表示できるウェブインターフェースの透過パススルー最大サイズ（例：HTMLページ）
SimpleToadletServer.passthroughMaxSizeProgressLong=HTMLページやファイルの最大サイズ。このサイズを超えるとバックグラウンドダウンロードするかどうかを確認します。
SimpleToadletServer.port=ウェブインターフェースのポート
SimpleToadletServer.portLong=ウェブインターフェースがリッスンするTCPポート
SimpleToadletServer.publicGatewayMode=公開ゲートウェイモード？（許可されたが完全アクセス権のない接続にのみ適用）
SimpleToadletServer.publicGatewayModeLong=公開ゲートウェイモードを有効にするかどうか。ハイファネットにアクセスは許可されているが完全アクセス権のないIPに対して、ダウンロードキューなどノードを攻撃できる可能性のある機能を無効にし、freesite閲覧のみ許可します。デフォルトブックマークのみ表示されます。完全アクセス権のあるIPはノード設定が可能です。本物の公開ゲートウェイにするには、許可アドレスとバインドアドレスを設定した後に再起動してください。
SimpleToadletServer.publicGatewayModeNeedsRestart=公開ゲートウェイモードの有効／無効はハイファネットの再起動が必要です。それまでは適用されませんので、他のfproxy設定は変更しないでください。
SimpleToadletServer.refilterPolicy=すでにフィルタ済みのファイルを再度取得した場合のfproxyの動作
SimpleToadletServer.refilterPolicyLong=すでにフィルタ済みのファイルを再度取得した場合の動作：RE_FILTER = フィルタを再度適用（フィルタが改善されている可能性あり）、ACCEPT_OLD = 古いデータを使用（最高性能）、RE_FETCH = 古いデータを無視して再取得。
SimpleToadletServer.sendAllThemes=ブラウザにすべてのテーマを送信しますか？
SimpleToadletServer.sendAllThemesLong=trueにするとFProxy UIページで利用可能なすべてのテーマをブラウザに読み込み、ブラウザのページスタイル選択で切り替え可能になります。
SimpleToadletServer.ssl=SSLを有効にしますか？
SimpleToadletServer.sslLong=ウェブインターフェースでSSLを有効にします。動作させるには「Java Cryptography Extension (JCE) Unlimited Strength Jurisdiction Policy Files」が必要です。
SSL.enable=SSLサポートを有効にしますか？
SSL.HSTS=HTTP Strict-Transport-Security max-age
SSL.HSTSLong=ブラウザがHTTPSのみでウェブインターフェースにアクセスできる期間（秒）。一般的な値：3600（1時間）、86400（1日）、604800（7日）、2592000（30日）。大きすぎると証明書期限切れ時にSSLエラーでアクセスできなくなる可能性があります。0に設定するかSSLを無効にするとHSTSヘッダは無効になります。
SSL.keyStore=キーストアのパス
SSL.keyStoreLong=キーストアファイルのパス。OpenSSLでPKCS12形式の有効なキーファイルを作成して使用できます。ファイルが存在しない場合は自己署名証明書がここに作成されます。
SSL.keyStorePass=キーストアのパスワード
SSL.keyPass=秘密鍵のパスワード
SSL.version=SSLのバージョン
SSL.versionLong=SSLバージョン（SSLv3またはTLSv1、デフォルトはSSLv3）
StartupToadlet.entropyErrorTitle=ハイファネットは起動に必要な追加のエントロピーを待っています
StartupToadlet.entropyErrorContent=ハイファネットは現在、コンピューターから十分なエントロピー（乱数性）を待っています。安全に暗号鍵を生成するために必要です。ディスクを読み込んでエントロピーを集めようとしています。詳細はwrapper.logを確認してください。
StartupToadlet.isStartingUp=ハイファネットノードを起動中です。少々お待ちください。
StartupToadlet.title=ハイファネットを起動中です
StaticToadlet.pathInvalidChars=指定されたURIに許可されていない文字が含まれています。
StaticToadlet.pathNotFound=指定されたパスは存在しません。
StaticToadlet.pathNotFoundTitle=パスが見つかりません
