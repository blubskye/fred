DarknetAddRefToadlet.explainBoxTitle=하이파넷을 실행하는 친구와 연결해야 하는 이유
DarknetAddRefToadlet.explainBox1=친구(실제로 아는 하이파넷 사용자)와 연결하면 하이파넷 보안이 크게 향상됩니다. 온라인 지인도 가능하지만, 완전히 모르는 사람을 추가하지 마세요. 모르는 사람을 친구로 추가하면 보안 향상이 거의 없고, 많은 사람이 그렇게 하면 네트워크 전체에 문제를 일으킬 수 있습니다. 항상 온라인인 친구를 최소 5명 이상 추가하면 네트워크 보안 수준을 HIGH로 높이고 친구만 연결하는 "다크넷 모드"를 사용할 수 있습니다. 이렇게 하면 공격자가 당신이 하이파넷을 실행 중이라는 사실조차 알아내기 매우 어려워지고, 익명성 공격이 훨씬 힘들어집니다. 하이파넷은 인터넷을 통해 친구와 직접 암호화된 연결을 맺으므로, 이미 쉽게 연락할 수 있는 사람(가족, 동료, 실제 친구, 온라인 친구)만 추가하세요.
