ChatForumsToadlet.frost=${frost-freenet}Frost${/frost-freenet} (${frost-web}웹 링크${/frost-web}) - 원조 하이파넷 토론 게시판 클라이언트. 심각한 스팸 및 서비스 거부 문제가 있으므로 다른 클라이언트를 강력 추천합니다. FMS와 마찬가지로 하이파넷 일부가 아니므로 직접 설치하고 실행해야 합니다.
ChatForumsToadlet.fms=${fms}FMS${/fms} - Freenet Message System은 활발히 유지보수되며 커뮤니티가 큰 게시판 클라이언트입니다. 하이파넷 일부가 아니므로 직접 다운로드해 실행해야 합니다.
ChatForumsToadlet.fsng=${fsng}Freenet Social Networking Guide${/fsng} - 이 비공식 가이드는 이러한 도구 및 기타 하이파넷 커뮤니케이션 도구 설정에 매우 도움이 됩니다.
ChatForumsToadlet.sone=${sone}Sone${/sone} - 사람과 팔로워 중심의 토론 시스템. 하이파넷 플러그인이며 WebOfTrust 플러그인이 필요합니다.
ChatForumsToadlet.content2=하이파넷 팀은 FMS나 Sone을 작성하거나 검토하지 않았으므로 품질을 보장할 수 없습니다. Freenet을 탐색하면 다른 많은 플러그인과 앱(위키 등)을 찾을 수 있습니다.
