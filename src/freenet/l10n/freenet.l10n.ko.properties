FirstTimeWizardToadlet.browserWarningIncognitoShort=시크릿 모드 브라우저를 사용 중입니다 (좋습니다)
FirstTimeWizardToadlet.browserWarning=일반 웹과 하이파넷을 같은 브라우저로 사용하지 마세요. (시크릿/프라이버시 모드 제외) 특히 브라우저 기록 탈취 공격으로 최근 방문한 freesite를 악의적인 사이트가 알아낼 수 있습니다. 하이파넷 전용 브라우저를 사용하세요. Windows에서는 시스템 트레이의 토끼 아이콘에서 "Browse Freenet"을 선택하면 Chrome 시크릿 모드가 자동으로 열립니다.
FirstTimeWizardToadlet.browserWarningMaybeSafe=최근 브라우저를 사용 중이므로 비교적 안전합니다. 하지만 하이파넷 방문 기록이 브라우저에 남습니다. 프라이버시/시크릿 모드를 사용하면 기록이 남지 않습니다.
FirstTimeWizardToadlet.browserWarningIncognito=시크릿/프라이버시 모드로 사용 중인 것 같습니다 (제목 표시줄 확인). 비교적 안전하지만, 일반 웹과 하이파넷을 같은 브라우저로 사용하지 마세요.
FirstTimeWizardToadlet.browserWarningIncognitoMaybeSafe=최근 브라우저의 시크릿/프라이버시 모드를 사용 중입니다. 비교적 안전합니다. Firefox 4 이전 버전에서는 일반 웹과 하이파넷을 같은 브라우저로 사용하지 마세요.
FirstTimeWizardToadlet.browserWarningFirefoxMightHaveClobberedTabs=하이파넷이 Firefox를 프라이버시 모드로 실행하려고 했습니다. 하이파넷 방문 기록이 남지 않습니다. 일부 버전에서는 기존 창과 탭이 닫힐 수 있습니다. Tools → Stop Private Browsing으로 되돌릴 수 있습니다. Firefox가 프라이버시 모드라면 제목 표시줄이나 탭에 표시됩니다. 그렇지 않으면 수동으로 프라이버시 모드에서 열고 ${url}을(를) 열거나, 하이파넷 전용 브라우저/프로필을 사용하세요.
FirstTimeWizardToadlet.browserWarningOldFirefox=Firefox 3 이하 버전을 사용 중입니다. Firefox 4 이상은 CSS history leak 방지 기능이 있어 프라이버시가 향상되었습니다. 가능하면 업그레이드하세요.
FirstTimeWizardToadlet.browserWarningOldFirefoxNewerHasPrivacyMode=최신 Firefox는 프라이버시 모드도 지원합니다.
FirstTimeWizardToadlet.browserWarningSuggestion=Microsoft Internet Explorer를 제외한 대부분의 브라우저(Firefox, Opera, Safari, Chrome, Lynx 등)가 하이파넷과 잘 작동합니다. 하나를 설치한 후 현재 URL을 복사해 새 브라우저에서 여세요.
FirstTimeWizardToadlet.browserImeWarning=서드파티 IME(아시아 언어 입력기)를 사용 중이라면 하이파넷에서는 비활성화하고 OS 기본 IME를 사용하세요. IME가 입력 내용을 수집한다는 보고가 있습니다.
RevocationChecker.revocationFetchFailedFatally=자동 업데이트 시스템이 침해되었습니다! 개인 키가 도난당했을 가능성이 있어 자동 업데이트가 영구적으로 꺼졌습니다. 설명 파일을 가져오는 데 예상치 못한 오류가 발생했습니다: "${detail}". 수동으로 revocation 키를 가져오세요 (키가 잘못 삽입되었을 수 있음; 안전을 위해 자동 업데이트를 즉시 끕니다): ${key}
