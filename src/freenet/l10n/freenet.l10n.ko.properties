Announcer.announceAlertIntro=하이파넷이 네트워크에 연결 중입니다 - 몇 분 정도 걸릴 수 있습니다. 성능은 앞으로 몇 시간 동안 계속 개선될 것입니다. 하이파넷을 몇 분 이상 종료할 때마다 발생하므로, 가능하면 하루 24시간 실행 상태로 두세요.
Announcer.announceAlertTitle=노드 알림
Announcer.announceDetails=최근 ${recentSentAnnouncements}개의 알림을 보냈으며, 그중 ${runningAnnouncements}개가 아직 실행 중입니다. ${addedNodes}개의 노드를 추가했으며 (${refusedNodes}개 노드가 거부했습니다). 현재 ${connectedSeednodes}개의 시드노드에 연결되어 있으며, 추가로 ${disconnectedSeednodes}개와 연결을 시도 중입니다.
Announcer.announceAlertNoSeednodes=seednodes.fref 파일을 찾을 수 없습니다. 따라서 하이파넷 노드가 자동으로 오픈넷에 부팅될 수 없습니다. 노드를 수동으로 추가하거나 https://raw.githubusercontent.com/hyphanet/java_installer/refs/heads/next/offline/seednodes.fref 에서 시드노드 파일을 다운로드하세요.
Announcer.announceLoading=하이파넷이 현재 네트워크 전체에 알림을 보내기 위해 시드노드 파일을 로딩 중입니다. 알림에는 몇 분 정도 걸릴 수 있습니다.
Announcer.announceDisabledTooOldTitle=알림 비활성화됨 (너무 오래됨)
Announcer.announceDisabledTooOld=이 노드는 현재 하이파넷 네트워크에 연결하기에는 너무 오래된 버전입니다. 노드가 피어로부터 최신 버전의 하이파넷을 다운로드한 후 업데이트를 위해 재시작합니다. 시간이 조금 걸릴 수 있습니다. 업데이트가 완료되면 이 메시지는 사라집니다. 의미가 없으므로 알림을 비활성화했습니다.
Announcer.announceDisabledTooOldUpdateDisabled=하이파넷이 자동 업데이트를 하도록 하려면 ${config}설정 페이지${/config}에서 자동 업데이트를 활성화하세요.
Announcer.announceDisabledTooOldShort=하이파넷 노드가 네트워크에 연결을 시도했으나, 현재 하이파넷 버전이 너무 오래되어 데이터를 라우팅할 수 없습니다. 업데이트해 주세요!
Announcer.announceAlertShort=하이파넷이 네트워크에 연결을 시도 중입니다. 잠시 동안 속도가 느려질 수 있습니다.
Announcer.coolingOff=다음 ${time}초 동안 하이파넷 노드는 방금 알림을 보낸 노드들이 연결되기를 기다리고 있습니다. 충분한 노드가 연결되지 않으면 다른 노드를 시도합니다.
Announcer.dontKnowAddress=하이파넷이 아직 우리의 IP 주소를 확인하지 못했습니다. IP를 알기 전까지는 알림을 보낼 수 없습니다.
