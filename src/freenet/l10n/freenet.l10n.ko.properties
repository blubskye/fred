RevocationKeyFoundUserAlert.text=하이파넷 자동 업데이트 시스템이 침해되었습니다! 신뢰할 수 있는 하이파넷 팀원이 자동 업데이트 키가 도난/유출되었다는 특별 서명 메시지를 업로드했습니다. 악성코드 설치 방지를 위해 자동 업데이트를 껐습니다. 안전하게 https://freenetproject.org/ 을(를) 확인하세요. 도둑이 아래 메시지 키를 가지고 있을 수도 있으니, 확인 없이 지시를 따르지 마세요.
