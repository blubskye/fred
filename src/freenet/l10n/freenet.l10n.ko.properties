RevocationKeyFoundUserAlert.titleDisabled=자동 업데이트기가 침해되었을 수 있습니다! 지금은 꺼두었으니 자세한 내용은 클릭하세요.
SecurityLevels.title=보안 수준
SecurityLevels.tooltip=하이파넷 노드의 보안 수준 설정
SecurityLevels.networkThreatLevelShort=인터넷을 통해 당신을 공격하는 낯선 사람에 대한 보호
SecurityLevels.networkThreatLevel=하이파넷에서 하는 일을 추적하려는 사람/조직으로부터 얼마나 많은 보안이 필요한가요?
SecurityLevels.networkThreatLevel.name.MAXIMUM=최고
SecurityLevels.networkThreatLevel.name.HIGH=높음
SecurityLevels.networkThreatLevel.name.NORMAL=보통
SecurityLevels.networkThreatLevel.name.LOW=낮음
SecurityLevels.networkThreatLevel.choice.MAXIMUM=체포, 수감, 또는 그 이상의 위험을 초래할 수 있는 정보에 접근할 계획입니다. 하이파넷이 실험적이며 일부 알려진 공격에 대한 보안이 보장되지 않음을 이해하고, 대안에 비해 위험을 감수합니다.
SecurityLevels.networkThreatLevel.desc.MAXIMUM=HIGH보다 ${bold}상당히${/bold} 느려지며, 친구와만 연결됩니다. 신뢰하는 사람과만 연결한다면 실제 신원은 비교적 안전합니다. 자세한 설명은 위저드의 ${link}"하이파넷을 누구와 연결해야 하나?" 페이지${/link} 하단을 참조하세요.
SecurityLevels.networkThreatLevel.choice.HIGH=다른 사람이 내 통신을 감시하기 어렵게 하거나, ISP/정부가 하이파넷을 차단할까 걱정됩니다.
SecurityLevels.networkThreatLevel.desc.HIGH=친구와만 연결하면 보안이 크게 향상되지만, 최소 5-10명의 친구를 추가하지 않으면 느려집니다.
SecurityLevels.networkThreatLevel.choice.NORMAL=비교적 자유로운 나라에 살지만, 다른 사람이 내 통신을 감시하기 어렵게 하고 싶습니다.
SecurityLevels.networkThreatLevel.desc.NORMAL=하이파넷이 익명성을 합리적으로 보호하지만 성능이 약간 희생됩니다. 하이파넷을 실행하는 친구를 추가하고 가능하면 HIGH로 업그레이드하세요.
SecurityLevels.networkThreatLevel.choice.LOW=감시를 신경 쓰지 않고 최대 성능을 원합니다.
SecurityLevels.networkThreatLevel.desc.LOW=다른 사람이 당신의 신원을 쉽게 알아낼 수 있습니다!
SecurityLevels.networkThreatLevel.opennetIntro=이미 하이파넷을 사용하는 사람을 개인적으로 아십니까? 3명 이상 안다면 다크넷 모드를 활성화할 수 있습니다. 하이파넷이 친구와만 연결되어 보안이 크게 향상됩니다. 아무도 모르거나 최대 성능을 원한다면 오픈넷 모드를 사용하세요. 낯선 사람의 하이파넷 노드와 자동 연결됩니다.
SecurityLevels.networkThreatLevel.opennetFriendsWarning=하이파넷 외에서 모르는 사람을 친구로 추가하면 보안이 향상되지 않고 성능이 떨어집니다!
SecurityLevels.networkThreatLevel.opennetLabel=오픈넷 모드 (낯선 사람과 친구 모두 연결)
SecurityLevels.networkThreatLevel.opennetExplain=하이파넷을 사용하는 사람을 모릅니다: 다른 하이파넷 노드와 자동 연결합니다.
SecurityLevels.networkThreatLevel.darknetLabel=다크넷 모드 (친구만 연결)
SecurityLevels.networkThreatLevel.darknetExplain=이미 하이파넷을 사용하는 사람을 최소 3명 (성능을 위해 10명 이상) 알고 있습니다: 친구와만 연결합니다.
SecurityLevels.noFriendsWarning=아직 친구를 추가하지 않았습니다. 네트워크 보안 수준을 HIGH 또는 MAXIMUM으로 설정하면 연결된 친구가 최소 1명 이상 있어야 하이파넷에 연결할 수 있습니다! 의미 있는 보안 효과를 위해 실제로 아는 사람이고 어느 정도 신뢰해야 하며, 좋은 성능을 위해서는 5-10명이 항상 연결되어 있어야 합니다. 괜찮습니까?
SecurityLevels.noFriendsCheckbox=괜찮습니다. HIGH 보안 수준을 활성화하고 곧 친구를 추가하겠습니다.
SecurityLevels.noConnectedFriendsWarning=${added}명의 친구를 추가했지만 연결된 친구가 없습니다. 보안 수준을 HIGH 또는 MAXIMUM으로 설정하면 친구가 온라인일 때만 하이파넷에 연결할 수 있습니다. 친구를 더 추가하거나, 친구가 온라인일 때만 사용하거나, HIGH로 업그레이드하지 마세요. 의미 있는 보안을 위해 친구는 실제로 아는 사람이고 어느 정도 신뢰해야 하며, 좋은 성능을 위해서는 5-10명이 항상 연결되어 있어야 합니다. 괜찮습니까?
SecurityLevels.noConnectedFriendsCheckbox=괜찮습니다. 친구를 더 추가하거나, 친구가 온라인일 때만 하이파넷이 온라인인 것을 받아들이겠습니다.
SecurityLevels.fewConnectedFriendsWarning=현재 연결된 친구가 ${connected}명이고, 총 ${added}명을 추가했습니다. 보안 수준을 HIGH 또는 MAXIMUM으로 설정하면 친구와만 연결되므로 성능이 크게 떨어지고, 모든 친구가 오프라인이면 연결 자체가 불가능합니다. 친구는 실제로 아는 사람이고 어느 정도 신뢰해야 하며, 좋은 성능을 위해서는 5-10명이 연결되어 있어야 합니다. 괜찮습니까?
SecurityLevels.fewConnectedFriendsCheckbox=괜찮습니다. 친구를 더 추가하거나, 성능 저하와 친구가 오프라인일 때 연결이 안 되는 것을 받아들이겠습니다.
SecurityLevels.networkThreatLevelLowWarning=노드의 네트워크 보안 수준을 LOW로 낮추려 합니다. 낯선 사람이 인터넷을 통해 익명성을 쉽게 공격할 수 있게 됩니다. 정말 괜찮습니까?
SecurityLevels.networkThreatLevelLowCheckbox=괜찮습니다. 속도를 더 원하고 하이파넷에서 무엇을 하는지 누구에게 알려도 상관없습니다!
SecurityLevels.networkThreatLevelConfirmTitle=경고: 네트워크 보안 수준을 ${mode}으로 설정합니다
SecurityLevels.maximumNetworkThreatLevelWarning=${bold}경고:${/bold} 최대 네트워크 보안 수준을 설정하려 합니다! 하이파넷이 ${bold}상당히${/bold} 느려집니다! 정말 보안이 필요할 때만 하세요!
SecurityLevels.maxSecurityYouNeedFriends=${bold}이미 하이파넷을 실행 중인 사람을 최소 1명${/bold} (가능하면 3명, 성능을 위해 5-10명) 알고 있어야 합니다. 친구 페이지에서 추가하세요. 실제로 아는 사람이고 어느 정도 신뢰해야 합니다.
SecurityLevels.maximumNetworkThreatLevelCheckbox=예, 최고 보안을 원합니다. 하이파넷이 여전히 실험적이며 추적될 가능성이 있고, 이 설정으로 성능이 크게 떨어진다는 것을 이해합니다!
SecurityLevels.physicalThreatLevelShort=다운로드, 업로드, 하이파넷 브라우징 캐시 보호
SecurityLevels.physicalThreatLevel=컴퓨터가 도난/압수당할 경우 얼마나 걱정되십니까?
SecurityLevels.physicalThreatLevelFDE=하드디스크 전체를 ${link}전체 디스크 암호화${/link} 소프트웨어로 암호화하는 것을 강력 추천합니다. 특히 Sone, FMS 같은 서드파티 앱을 사용할 때 최고의 보호를 제공하지만 설정에 시간이 걸릴 수 있습니다. 그 외에는 다운로드, 업로드, 최근 방문 freesite 캐시에 비밀번호를 설정할 수 있습니다.
SecurityLevels.physicalThreatLevelFDELink=https://en.wikipedia.org/wiki/Comparison_of_disk_encryption_software
SecurityLevels.physicalThreatLevelSwapfile=가능하면 스왑 공간도 암호화하세요 (${operatingSystem}이 메모리 부족 시 사용하는 임시 파일). 전체 디스크 암호화보다 설정하기 쉬울 수 있습니다.
SecurityLevels.physicalThreatLevelSwapfileWindows=일부 Windows 버전에서는 "fsutil behavior set encryptpagingfile 1" 명령으로 스왑 파일을 암호화할 수 있습니다.
SecurityLevels.physicalThreatLevel.name.LOW=없음
SecurityLevels.physicalThreatLevel.choice.LOW=아무것도 암호화하지 않습니다. (전체 디스크 암호화를 이미 사용 중인 경우에만 선택)
SecurityLevels.physicalThreatLevel.desc.LOW=하이파넷이 약간 빨라지고 기존 전체 디스크 암호화에 의존합니다.
SecurityLevels.physicalThreatLevel.name.NORMAL=낮음
SecurityLevels.physicalThreatLevel.choice.NORMAL=다운로드, 업로드, 최근 방문 freesite 캐시를 강력한 키로 암호화하여 빠르게 삭제할 수 있게 합니다.
SecurityLevels.physicalThreatLevel.desc.NORMAL=패닉 버튼을 사용하거나 master.keys 파일을 안전하게 삭제하면 데이터를 빠르게 지울 수 있습니다. 큰 파일은 "다운로드" 대신 "가져오기"를 추천합니다. 파일이 암호화되어 다운로드 페이지에서만 볼 수 있습니다. 컴퓨터가 압수되면 패닉 버튼을 누르지 않은 이상 활동 내역을 볼 수 있습니다.
SecurityLevels.physicalThreatLevel.name.HIGH=높음
SecurityLevels.physicalThreatLevel.choice.HIGH=다운로드, 업로드, 최근 방문 freesite 캐시를 비밀번호로 보호합니다.
SecurityLevels.physicalThreatLevel.desc.HIGH=다운로드 큐와 최근 방문 사이트 캐시에 접근하려면 비밀번호를 입력해야 합니다. 패닉 버튼도 사용할 수 있습니다.
SecurityLevels.physicalThreatLevel.name.MAXIMUM=최고
SecurityLevels.physicalThreatLevel.choice.MAXIMUM=임시 암호화 키를 사용해 재시작 시 다운로드, 업로드, 최근 방문 캐시가 모두 삭제됩니다.
SecurityLevels.physicalThreatLevel.desc.MAXIMUM=암호화 키를 RAM에만 유지하고 디스크에 저장하지 않습니다. 모든 다운로드/업로드는 재시작까지 유지되며, 파일을 디스크에 쓰지 않습니다. Freenet에서 콘텐츠를 실수로 저장하지 않도록 주의하세요. 특히 FMS, Sone 같은 서드파티 플러그인을 사용할 계획이라면 전체 디스크 암호화 소프트웨어를 설치하는 것을 고려하세요!
SecurityLevels.physicalThreatLevelEnd=표준 보안 수칙(최신 상태 유지, 안티바이러스 실행, 신뢰하지 않는 파일 열지 않기 등)을 따르세요. 하이파넷이 실행 중인 상태에서 컴퓨터가 압수되면 어떤 암호화도 도움이 되지 않습니다!
OperatingSystemName.Windows=Windows
OperatingSystemName.Linux=Linux
OperatingSystemName.MacOS=MacOS
OperatingSystemName.FreeBSD=FreeBSD
OperatingSystemName.GenericUnix=UNIX
OperatingSystemName.Unknown=사용 중인 운영체제
SecurityLevels.userAlertShortText=보안 수준: 네트워크 ${network}, 친구 ${friends}, 물리적 ${physical}
SecurityLevels.userAlertNetworkThreatLevel=인터넷을 통한 낯선 사람 공격에 대한 보호: ${level}
SecurityLevels.userAlertPhysicalThreatLevel=컴퓨터 압수/도난 시 보호: ${level}
SecurityLevels.userAlertExtro=이 설정은 ${link}설정 페이지${/link}에서 언제든지 변경할 수 있습니다.
SecurityLevels.passwordPageTitle=마스터 비밀번호를 입력하세요
SecurityLevels.passwordSubmit=확인
SecurityLevels.passwordWrongTitle=비밀번호가 틀렸습니다
SecurityLevels.enterPasswordTitle=캐시된 콘텐츠와 대기 중인 다운로드/업로드에 접근하려면 마스터 비밀번호를 입력하세요
SecurityLevels.passwordWrong=잘못된 비밀번호를 입력했습니다. 클라이언트 캐시 접근과 브라우징 성능 향상을 위해 올바른 비밀번호를 입력하세요.
SecurityLevels.enterPassword=다운로드/업로드 접근을 활성화하고 최근 방문 freesite 캐시를 사용해 성능을 향상시키려면 마스터 비밀번호를 입력하세요.
SecurityLevels.setPasswordLabel=비밀번호 설정
SecurityLevels.confirmPasswordLabel=비밀번호 확인
SecurityLevels.passwordLabel=비밀번호
SecurityLevels.setPassword=캐시된 콘텐츠를 보호할 마스터 비밀번호를 설정하세요. 문자, 숫자, 구두점을 많이 사용한 강력한 비밀번호가 좋습니다.
SecurityLevels.passwordNotZeroLength=비밀번호는 최소 1자 이상이어야 합니다 (빈 문자열 불가).
SecurityLevels.passwordsDoNotMatch=입력한 비밀번호가 일치하지 않습니다.
SecurityLevels.passwordTooLong=비밀번호가 너무 깁니다. 최대 1024자까지입니다.
SecurityLevels.passwordForDecryptTitle=이전 비밀번호 입력
SecurityLevels.passwordForDecrypt=클라이언트 캐시 등의 암호를 해제하려면 이전 비밀번호가 필요합니다.
SecurityLevels.cantWriteNewMasterKeysFileTitle=새 master.keys 파일에 쓸 수 없습니다!
SecurityLevels.cantWriteNewMasterKeysFile=문제가 발생했습니다 - 디스크 공간 부족 또는 하드디스크 문제일 수 있습니다. 자세한 오류 메시지를 확인하세요:
SecurityLevels.oldPasswordLabel=이전 비밀번호:
SecurityLevels.newPasswordLabel=새 비밀번호:
SecurityLevels.confirmNewPasswordLabel=비밀번호 확인:
SecurityLevels.setPasswordTitle=새 마스터 비밀번호 설정
SecurityLevels.changePasswordButton=비밀번호 변경
SecurityLevels.changePasswordTitle=마스터 비밀번호 변경
SecurityLevels.backToSecurityLevels=비밀번호 설정/변경하지 않고 보안 수준 페이지로 돌아가기
SecurityLevels.passwordFileCorruptedTitle=마스터 비밀번호 파일 손상됨
SecurityLevels.passwordFileCorrupted=마스터 비밀번호 파일 ${file}이(가) 손상되었습니다. 파일을 삭제하고 클라이언트 캐시와 다운로드/업로드 큐를 잃거나, 백업에서 복원할 수 있습니다.
SecurityLevels.wrongOldPassword=이전 비밀번호가 틀렸습니다. 비밀번호를 잊었다면 master.keys 파일을 삭제하고 새 비밀번호를 설정할 수 있지만, 이전 비밀번호로 보호된 모든 데이터(최근 방문 사이트 캐시와 다운로드 큐 등)를 잃게 됩니다.
SecurityLevels.cantDeletePasswordFileTitle=마스터 비밀번호 파일을 삭제할 수 없습니다!
SecurityLevels.cantDeletePasswordFile=하이파넷이 마스터 비밀번호 파일 ${filename}을(를) 삭제할 수 없습니다. 컴퓨터가 압수당하면 최근 방문 사이트 캐시와 다운로드/업로드가 복호화될 수 있으므로 직접 안전하게 삭제해야 합니다. ${filename}을(를) 수동으로 삭제하세요.
SecurityLevels.cantDeletePasswordFileButton=다시 시도
SecurityLevels.warningMaximumWillDeleteQueue=경고: 이 보안 수준을 선택하면 다음 재시작 시 다운로드/업로드 큐가 삭제됩니다!
SecurityLevelsToadlet.fullTitle=보안 수준
SecurityLevels.statusBarPrefix=보안 수준:
StringArrOption.parseError=문자열 배열로 값을 파싱할 수 없습니다: ${error}
ShortOption.unrecognisedShort=지정한 값이 16비트 정수로 파싱되지 않습니다: ${val}
SimpleHelpToadlet.CHK=CHK = Content Hash Key - 파일의 수학적 해시로 파생된 정적 키.
SimpleHelpToadlet.SSK=SSK = Signed Subspace Key -
SimpleHelpToadlet.USK=USK = Updateable Subspace Key -
SimpleHelpToadlet.connectivityText=테스트 중. 테스트.   블라 블라 블라, 등등
SimpleHelpToadlet.connectivityTitle=연결성
SimpleHelpToadlet.definitionsTitle=정의
SimpleHelpToadlet.descriptionText=이 페이지는 하이파넷을 시작하는 데 필요한 기본 정보를 제공합니다. 더 자세한 정보는 공식 하이파넷 웹사이트 http://freenetproject.org, 공식 위키 http://wiki.freenetproject.org, 또는 하이파넷 내 freesite에서 찾을 수 있습니다.
SimpleHelpToadlet.descriptionTitle=설명
SimpleToadletServer.advancedMode=고급 모드를 활성화하시겠습니까?
SimpleToadletServer.advancedModeLong=웹 인터페이스에서 고급 옵션과 정보를 기본으로 표시합니다. 대부분의 경우 false로 두는 것이 좋습니다.
SimpleToadletServer.allowedFullAccess=하이파넷 웹 인터페이스에 완전 접근 권한을 가진 호스트 (경고 읽기)
SimpleToadletServer.allowedFullAccessLong=하이파넷 노드에 완전 접근 권한(설정 변경, 재시작 등)을 부여받은 호스트. 경고: 완전 웹 인터페이스 접근 권한을 주는 상대를 신중히 선택하세요!
SimpleToadletServer.allowedHosts=웹 인터페이스 연결을 허용할 호스트명 또는 IP 주소.
SimpleToadletServer.allowedHostsLong=단일 IP나 192.168.0.0/24 같은 CIDR 마스크 IP를 쉼표로 구분한 목록. 다른 설정에 따라 하드디스크 접근과 북마크를 볼 수 있습니다.
SimpleToadletServer.bindTo=바인드할 IP 주소
SimpleToadletServer.bindToLong=바인드할 IP 주소
SimpleToadletServer.cannotChangePortOnTheFly=웹 인터페이스 포트 번호는 실행 중에 변경할 수 없습니다
SimpleToadletServer.couldNotChangeBindTo=웹 인터페이스 바인드 주소를 변경할 수 없습니다: 일부 IP 주소를 바인드할 수 없습니다: ${failedInterfaces}. IP 주소를 잘못 입력했거나 네트워크 연결이 끊어졌을 수 있습니다.
SimpleToadletServer.cssName=웹 인터페이스 테마
SimpleToadletServer.cssNameLong=하이파넷 웹 인터페이스에 사용할 테마 선택
SimpleToadletServer.cssOverride=CSS를 사용자 정의 파일로 오버라이드 (경고!)
SimpleToadletServer.cssOverrideCantRead=제공된 CSS 오버라이드 파일을 읽을 수 없습니다: ${filename}
SimpleToadletServer.cssOverrideLong=하이파넷 CSS를 사용자 정의 파일로 오버라이드할 수 있습니다. 경고: CSS는 위험할 수 있으며 필터링되지 않습니다! 사용에 주의하세요. /static/override/ (파일이 있는 폴더 내 파일명)에서 CSS 파일에 접근할 수 있으므로 이미지나 다른 CSS를 @include할 수 있습니다. 좋은 테마를 만들었다면 devl@freenetproject.org로 메일 보내 주세요.
SimpleToadletServer.cssOverrideNotInUploads=해당 설정을 허용할 수 없습니다: "${filename}"은(는) 업로드가 허용된 디렉토리에 없습니다!
SimpleToadletServer.cssOverrideCantUseRootDir=오버라이드 파일을 루트 폴더(${filename})에 둘 수 없습니다. 해당 폴더 안의 하위 폴더로 이동하세요. 보안 때문입니다.
SimpleToadletServer.disableProgressPage=페이지 로딩 시 진행 페이지 비활성화?
SimpleToadletServer.disableProgressPageLong=페이지 로딩 시 진행 페이지를 표시하지 않습니다. 참고: 진행 페이지는 가져오기 진행 상황을 알려주고 브라우저의 제한된 병렬 연결을 더 잘 활용할 수 있게 해줍니다.
SimpleToadletServer.doRobots=robots.txt로 로봇 제외?
SimpleToadletServer.doRobotsLong=google, spider, wget 등이 접근하지 못하도록 /robots.txt를 제공할지 여부
SimpleToadletServer.enableActivelinks=액티브링크 활성화?
SimpleToadletServer.enableActivelinksLong=Browse Freenet 페이지에 각 북마크 페이지에 아이콘을 표시할지 여부. 아이콘을 표시하지 않으면 페이지 로딩이更快합니다.
SimpleToadletServer.enableCachingForChkAndSskKeys=CHK 및 SSK 키에 대한 브라우저 캐싱 허용 (경고 읽기)
SimpleToadletServer.enableCachingForChkAndSskKeysLong=브라우저가 CHK와 SSK 키를 캐싱할 수 있게 합니다. 경고: 이렇게 하면 브라우저 캐시에 모든 키의 흔적이 남으므로 컴퓨터 압수에 대비한다면 활성화하지 마세요!
SimpleToadletServer.enableJS=웹 인터페이스에서 JavaScript 사용 허용?
SimpleToadletServer.enableJSLong=웹 인터페이스가 JavaScript "helpers"를 사용할지 여부. freesite는 이 설정과 관계없이 JavaScript를 사용하지 않을 수 있습니다.
SimpleToadletServer.enableWP=웹 인터페이스에서 웹 푸시(실험적) 사용 허용?
SimpleToadletServer.enableWPLong=웹 인터페이스가 JavaScript 웹 푸시를 사용해 페이지를 새로고침하지 않고 데이터를 업데이트할지 여부. JavaScript가 활성화되어 있어야 하며, 실험적 기능이므로 사용에 주의하세요.
SimpleToadletServer.enabled=웹 인터페이스(FProxy) 활성화?
SimpleToadletServer.enabledLong=웹 인터페이스와 관련 HTTP 서비스를 활성화할지 여부. 브라우저로 하이파넷 사용자 인터페이스에 접근할 수 있습니다.
SimpleToadletServer.enableExtendedMethodHandling=확장 HTTP 메서드 처리 활성화?
SimpleToadletServer.enableExtendedMethodHandlingLong=GET과 POST 외의 HTTP 메서드를 처리할지 여부. WebDAV 등 HTTP 확장에 필요합니다.
SimpleToadletServer.enableInlinePrefetch=인라인 이미지 미리 가져오기 활성화?
SimpleToadletServer.enableInlinePrefetchLong=브라우저가 하이파넷과 적은 수의 연결만 사용하는 경우 도움이 될 수 있습니다. 반대로 도움이 안 될 수도 있습니다.
SimpleToadletServer.enablePersistentConnections=지속 HTTP 연결 활성화? (자세한 설명 읽기)
SimpleToadletServer.enablePersistentConnectionsLong=브라우저가 지속 연결을 사용하더라도 많은 연결을 사용하도록 설정된 경우에만 활성화하세요.
SimpleToadletServer.fetchKeyBoxAboveBookmarks='freesite 방문 또는 파일 다운로드' 필드를 상단에 배치?
SimpleToadletServer.fetchKeyBoxAboveBookmarksLong=true로 하면 홈페이지 상단에 'freesite 방문 또는 파일 다운로드' 필드가 표시됩니다.
SimpleToadletServer.hasCompletedWizard=최초 설정 마법사를 완료하셨습니까?
SimpleToadletServer.hasCompletedWizardLong=최초 설정 마법사를 완료했는지 여부. 완료하지 않았다면 웹 인터페이스가 모든 요청을 마법사로 리디렉션합니다.
SimpleToadletServer.illegalCSSName=CSS 이름에 슬래시나 콜론을 포함할 수 없습니다!
SimpleToadletServer.maxFproxyConnections=최대 fproxy 연결 수
SimpleToadletServer.maxFproxyConnectionsLong=한 번에 처리할 최대 fproxy 연결 수. 각 연결은 스레드를 사용합니다.
SimpleToadletServer.metaRefreshSamePageInterval=freesite가 주기적으로 자신을 새로고침하는 것을 허용: 최소 간격(초) 또는 -1로 비활성화
SimpleToadletServer.metaRefreshSamePageIntervalLong=HTML meta refresh로 freesite가 주기적으로 자신을 새로고침하는 것을 허용: 최소 간격(초) 또는 -1로 비활성화
SimpleToadletServer.metaRefreshRedirectInterval=freesite가 지연 후 다른 freesite로 리디렉션하는 것을 허용: 최소 간격(초) 또는 -1로 비활성화
SimpleToadletServer.metaRefreshRedirectIntervalLong=HTML meta refresh로 freesite가 지연 후 다른 freesite로 리디렉션하는 것을 허용: 최소 간격(초) 또는 -1로 비활성화
SimpleToadletServer.embedM3uPlayerInFreesites=freesite에 m3u 플레이어 내장?
SimpleToadletServer.embedM3uPlayerInFreesitesLong=하이파넷 팀이 검증한 JavaScript 기반 플레이어를 freesite의 video/audio 태그에 m3u 플레이리스트로 변환해 즉시 재생할 수 있게 할지 여부.
SimpleToadletServer.panicButton=패닉 버튼 표시?
SimpleToadletServer.panicButtonLong=큐 페이지에 '패닉 버튼'을 표시합니다. 모든 다운로드/업로드를 제거하고, 최근 방문 freesite 캐시를 지우고, master.keys 파일을 삭제합니다.
SimpleToadletServer.noConfirmPanic=패닉 버튼에 확인 창 표시 안 함?
SimpleToadletServer.noConfirmPanicLong=true로 하면 패닉 버튼이 즉시 실행되고 확인 창을 표시하지 않습니다.
SimpleToadletServer.passthroughMaxSize=진행 상황을 표시할 수 없는 웹 인터페이스 투명 통과 최대 크기 (예: 이미지)
SimpleToadletServer.passthroughMaxSizeLong=이미지, 스타일시트 등에 대한 최대 크기. 이 크기보다 크면 실패하고, 가능하면 오류를 표시합니다. 브라우저가 거대한 이미지로 가득 찬 페이지를 영원히 기다리는 것을 방지합니다.
SimpleToadletServer.passthroughMaxSizeProgress=진행 막대를 표시할 수 있는 웹 인터페이스 투명 통과 최대 크기 (예: HTML 페이지)
SimpleToadletServer.passthroughMaxSizeProgressLong=HTML 페이지나 파일의 최대 크기. 이 크기보다 크면 백그라운드 다운로드를 할지 물어봅니다.
SimpleToadletServer.port=웹 인터페이스 포트
SimpleToadletServer.portLong=웹 인터페이스가 리슨할 TCP 포트
SimpleToadletServer.publicGatewayMode=공개 게이트웨이 모드? (허용되었으나 완전 접근 권한이 없는 연결에만 적용)
SimpleToadletServer.publicGatewayModeLong=공개 게이트웨이 모드를 활성화할지 여부. 하이파넷에 접근은 허용되었으나 완전 접근 권한이 없는 IP에 대해 다운로드 큐 등 노드를 공격할 수 있는 모든 기능을 비활성화하고 freesite 탐색만 허용합니다. 기본 북마크만 보입니다. 완전 접근 권한이 있는 IP는 노드를 설정할 수 있습니다. 진짜 공개 게이트웨이로 만들려면 허용 주소와 바인드 주소를 설정한 후 재시작하세요.
SimpleToadletServer.publicGatewayModeNeedsRestart=공개 게이트웨이 모드를 켜거나 끄려면 하이파넷을 재시작해야 합니다. 그 전까지는 적용되지 않으므로 다른 fproxy 설정을 변경하지 마세요.
SimpleToadletServer.refilterPolicy=이미 필터링된 파일을 다시 가져왔을 때 fproxy가 어떻게 할지
SimpleToadletServer.refilterPolicyLong=이미 필터링된 파일을 다시 가져왔을 때 fproxy의 동작: RE_FILTER = 필터를 다시 적용 (필터가 개선되었을 수 있음), ACCEPT_OLD = 기존 데이터를 사용 (최대 성능), RE_FETCH = 기존 데이터를 무시하고 다시 가져옴.
SimpleToadletServer.sendAllThemes=브라우저에 모든 테마 전송?
SimpleToadletServer.sendAllThemesLong=true로 하면 FProxy UI 페이지에서 모든 테마를 브라우저에 로드하고, 브라우저의 페이지 스타일 선택 옵션으로 전환할 수 있습니다.
SimpleToadletServer.ssl=SSL 활성화?
SimpleToadletServer.sslLong=웹 인터페이스에서 SSL을 활성화합니다. 작동하려면 'Java Cryptography Extension (JCE) Unlimited Strength Jurisdiction Policy Files'이 필요합니다.
SSL.enable=SSL 지원 활성화?
SSL.HSTS=HTTP Strict-Transport-Security max-age
SSL.HSTSLong=브라우저가 HTTPS만으로 웹 인터페이스에 접근할 수 있는 시간(초). 일반 값: 3600(1시간), 86400(1일), 604800(7일), 2592000(30일). 너무 큰 값은 인증서 만료 시 SSL 오류로 웹 인터페이스에 접근하지 못할 수 있습니다. 0으로 설정하거나 SSL을 비활성화하면 HSTS 헤더가 비활성화됩니다.
SSL.keyStore=키 저장소 경로
SSL.keyStoreLong=키 저장소 파일 경로. OpenSSL로 PKCS12 형식의 유효한 키 파일을 만들어 사용할 수 있습니다. 파일이 없으면 자체 서명 인증서가 생성됩니다.
SSL.keyStorePass=키 저장소 비밀번호
SSL.keyPass=개인 키 비밀번호
SSL.version=SSL 버전
SSL.versionLong=SSL 버전 (SSLv3 또는 TLSv1, 기본 SSLv3)
StartupToadlet.entropyErrorTitle=하이파넷이 시작하기 전에 더 많은 엔트로피를 기다리고 있습니다
StartupToadlet.entropyErrorContent=하이파넷이 현재 컴퓨터로부터 더 많은 엔트로피(무작위성)를 기다리고 있습니다. 하이파넷은 안전하게 암호화 키를 생성하기 위해 엔트로피가 필요합니다. 디스크를 읽어 엔트로피를 수집하려고 합니다. 자세한 내용은 wrapper.log를 참조하세요.
StartupToadlet.isStartingUp=하이파넷 노드가 시작 중입니다. 잠시만 기다려 주세요.
StartupToadlet.title=하이파넷이 시작 중입니다
