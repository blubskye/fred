DarknetAddRefToadlet.explainInstallerWindowsNotYet=하이파넷이 아직 Windows 설치 프로그램을 다운로드하지 못했습니다. 하이파넷을 통해 ${link}여기${/link}에서 받을 수 있습니다.
DarknetAddRefToadlet.explainInstallerNonWindows=최신 비-Windows 설치 프로그램은 ${filename} 또는 ${get-nonwindows}여기${/get-nonwindows}에서 받을 수 있습니다. Java로 열어야 하는 jar 파일입니다. 친구가 더블클릭으로 실행할 수 있기를 바랍니다. 안 되면 명령줄에서 "java -jar ${shortfilename}"을 입력해 보세요.
